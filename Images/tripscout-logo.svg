  </g>
  <!-- Wordmark -->
  <text x="46" y="27" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0B2B2A">Trip<tspan fill="#0E7C7B">Scout</tspan></text>
