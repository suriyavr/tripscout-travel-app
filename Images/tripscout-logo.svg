    <circle cx="20" cy="20" r="18" fill="#0E7C7B"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="#0B5E5D" stroke-width="1.5"/>
    <!-- compass needle -->
    <polygon points="20,8 24,20 20,32 16,20" fill="#FFFFFF"/>
    <polygon points="20,8 24,20 20,20" fill="#FF6B4A"/>
